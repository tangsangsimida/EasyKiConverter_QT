name: Deploy Documentation

on:
  push:
    branches: [ 'master']
    paths:
      - 'docs/**'
      - 'src/**'
      - 'mkdocs.yml'
      - 'Doxyfile'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install mkdocs-material==9.6.18

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen graphviz

      - name: Generate Doxygen API Documentation
        run: |
          mkdir -p build/docs/api
          doxygen Doxyfile

      - name: Copy API docs to MkDocs site
        run: |
          mkdir -p docs/api/html
          cp -r build/docs/api/html/* docs/api/html/

      - name: Build and Deploy
        run: mkdocs gh-deploy --force --no-strict
