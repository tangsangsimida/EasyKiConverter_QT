name: 'Setup Build Environment'
description: 'Setup CMake, Qt, and build cache for EasyKiConverter project'

inputs:
  cmake-version:
    description: 'CMake version to install'
    required: false
    default: '3.22'
  setup-cmake:
    description: 'Whether to install the pinned CMake version'
    required: false
    default: 'true'
  qt-version:
    description: 'Qt version to install'
    required: false
    default: '6.10.2'
  qt-host:
    description: 'Qt host platform'
    required: false
    default: 'linux'
  qt-target:
    description: 'Qt target platform'
    required: false
    default: 'desktop'
  qt-arch:
    description: 'Qt architecture'
    required: false
    default: ''
  qt-modules:
    description: 'Qt modules to install'
    required: false
    default: ''
  enable-ccache:
    description: 'Enable CCache (Linux/macOS)'
    required: false
    default: 'true'
  enable-sccache:
    description: 'Enable sccache (Windows)'
    required: false
    default: 'true'
  install-linux-deps:
    description: 'Install Linux system dependencies'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: 'Install Linux Dependencies'
      if: inputs.install-linux-deps == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get -y -qq update
        sudo apt-get -y --no-install-recommends install \
          cmake \
          build-essential \
          libgl1-mesa-dev \
          libxcb-xinerama0 \
          libxcb-cursor0 \
          libxkbcommon-x11-0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-shape0 \
          libxcb-render-util0 \
          libxcb-xfixes0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render0 \
          libxcb-shm0 \
          libxcb-util1 \
          libwayland-dev \
          libegl1-mesa-dev \
          libgles2-mesa-dev \
          libfontconfig1-dev \
          libfreetype6-dev \
          libharfbuzz-dev \
          libdbus-1-dev \
          libglib2.0-0

    - name: 'Setup CMake'
      if: inputs.setup-cmake == 'true'
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
      with:
        cmake-version: ${{ inputs.cmake-version }}

    - name: 'Setup Python for macOS Qt installation'
      if: runner.os == 'macOS'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
      with:
        version: ${{ inputs.qt-version }}
        host: ${{ inputs.qt-host }}
        target: ${{ inputs.qt-target }}
        arch: ${{ inputs.qt-arch }}
        modules: ${{ inputs.qt-modules }}
        cache: true
        setup-python: false
        add-tools-to-path: true
        set-env: true

    - name: 'Setup CCache'
      if: inputs.enable-ccache == 'true' && (runner.os == 'Linux' || runner.os == 'macOS')
      uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
      with:
        key: ${{ runner.os }}-build-${{ hashFiles('**/CMakeLists.txt') }}

    - name: 'Setup sccache'
      if: inputs.enable-sccache == 'true' && runner.os == 'Windows'
      uses: mozilla-actions/sccache-action@89e9040de88b577a072e3760aaf59f585da083af # v0.0.5
